<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Familie"><title>Familie</title><style>:root{--bg:#f7f7f8;--card:#fff;--text:#17202a;--muted:#6b7280;--blue:#1769e0;--red:#d92d20;--line:#e6e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}main{max-width:560px;margin:auto;padding:30px 18px}h1{font-size:36px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:17px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #00000008}.cardhead{display:flex;justify-content:space-between}.title{font-size:22px;font-weight:750}.pill{font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:#edf4ff;color:var(--blue)}.timer{font-size:40px;font-weight:800;margin:12px 0}.over{color:var(--red)}.ready{color:var(--muted);font-size:28px}.next{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:15px}button{width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:750;background:var(--blue);color:#fff}.history{margin-top:25px}.history h2{font-size:22px}.empty,.row{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:12px}.row b{display:block}.row small{color:var(--muted)}.duration{font-weight:750;white-space:nowrap}.note{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}</style></head><body><main><h1>Familie</h1><div class="subtitle">Max · enkel oversikt</div><div id="cards"></div><section class="history"><h2>Historikk</h2><div id="history"></div></section><div class="note">Data lagres på denne enheten. Ingen Dexcom eller kalender.</div></main><script>
const KEY="familie-v1",PLAN={sensor:9*86400000,innstikk:3*86400000},LABEL={sensor:"Sensor",innstikk:"Innstikk"};let state=JSON.parse(localStorage.getItem(KEY)||"null")||{sensor:null,innstikk:null,history:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state)),fmt=d=>new Intl.DateTimeFormat("nb-NO",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(d)),fmtDate=d=>new Intl.DateTimeFormat("nb-NO",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(d));
function diff(ms){let s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60),x=s%60;return d+" d "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function card(t){let st=state[t],en=st?st+PLAN[t]:0,n=Date.now(),x='<section class="card"><div class="cardhead"><div class="title">'+LABEL[t]+'</div><div class="pill">'+(t=="sensor"?"9 dager":"3 dager")+'</div></div>';if(!st)x+='<div class="timer ready">Ikke startet</div><div class="next">Trykk knappen for å starte perioden.</div>';else{let left=en-n;x+='<div class="timer '+(left<=0?"over":"")+'">'+(left<=0?"OVER TIDEN":diff(left))+'</div><div class="next">Neste bytte: <b>'+fmtDate(en)+'</b><br>Startet: '+fmt(st)+'</div>'}return x+'<button onclick="change(\''+t+'\')">'+(st?"BYTT ":"START ")+LABEL[t].toUpperCase()+' NÅ</button></section>'}
function render(){cards.innerHTML=card("sensor")+card("innstikk");history.innerHTML=state.history.length?state.history.slice().reverse().map(x=>'<div class="row"><div><b>'+LABEL[x.type]+'</b><small>'+fmt(x.start)+' → '+fmt(x.end)+(x.early?" · byttet tidlig":"")+'</small></div><div class="duration">'+x.days+' d</div></div>').join(""):'<div class="empty">Ingen tidligere perioder ennå.</div>'}
function change(t){let old=state[t],now=Date.now();if(old){let actual=now-old;if(!confirm("Bytte "+LABEL[t].toLowerCase()+" nå?\n\nGammel periode lagres i historikken."))return;state.history.push({type:t,start:old,end:now,days:Math.round(actual/86400000*10)/10,early:actual<PLAN[t]})}state[t]=now;save();render()}render();setInterval(render,1000);
</script></body></html>
